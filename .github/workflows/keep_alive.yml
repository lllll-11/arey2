name: Arey Cloud Server Keep-Alive

on:
  schedule:
    # Ejecuta cada 5 minutos para evitar que la instancia free de Render se duerma
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Arey Server Health Endpoint
        run: |
          echo "Realizando ping a Arey Server en Render..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://arey2-1.onrender.com/health")
          echo "HTTP Status recibido: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 301 ] || [ "$HTTP_STATUS" -eq 302 ]; then
            echo "✅ Servidor de Arey activo y respondiendo con éxito."
          else
            echo "⚠️ Servidor respondió con código $HTTP_STATUS o tardó en responder (despertando)."
          fi
