services:
  - type: web
    name: arey-brain
    runtime: docker
    rootDir: arey-server
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: DEVICE_AUTH_TOKEN
        value: arey-secret-token-2026
